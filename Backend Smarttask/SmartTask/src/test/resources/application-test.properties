spring.datasource.url=jdbc:h2:mem:smarttask_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.flyway.enabled=false

app.jwt.secret=SmartTaskSecretKeyForDevelopmentOnlyMustBeAtLeast256BitsLong!!
app.jwt.expiration-ms=86400000

app.ai.enabled=false
app.ai.service-url=http://localhost:8000

app.driver.alerts.enabled=false

app.automation.express.enabled=false
