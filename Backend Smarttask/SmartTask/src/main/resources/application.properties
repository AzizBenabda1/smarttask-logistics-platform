spring.application.name=SmartTask
server.port=9090

spring.config.import=optional:classpath:application-local.properties

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smarttask_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT
app.jwt.secret=${JWT_SECRET:SmartTaskSecretKeyForDevelopmentOnlyMustBeAtLeast256BitsLong!!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# SmartTask AI microservice (Python FastAPI)
app.ai.enabled=${AI_SERVICE_ENABLED:true}
app.ai.service-url=${AI_SERVICE_URL:http://localhost:8000}
app.ai.timeout-seconds=${AI_SERVICE_TIMEOUT:10}

# IA Automation — Chaîne 1 Livraison Express Autonome
app.automation.express.enabled=${EXPRESS_AUTOMATION_ENABLED:true}
app.automation.express.min-driver-score=${EXPRESS_MIN_DRIVER_SCORE:70}
app.automation.express.auto-trigger-priorities=${EXPRESS_AUTO_PRIORITIES:HIGH,CRITICAL}

# Alertes IA proactives chauffeur
app.driver.alerts.enabled=${DRIVER_ALERTS_ENABLED:true}
app.driver.alerts.interval-ms=${DRIVER_ALERTS_INTERVAL_MS:300000}
app.driver.alerts.deadline-warning-minutes=${DRIVER_ALERTS_DEADLINE_MIN:45}
app.driver.alerts.delay-risk-minutes=${DRIVER_ALERTS_DELAY_RISK_MIN:20}
app.driver.alerts.dedup-minutes=${DRIVER_ALERTS_DEDUP_MIN:30}

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
