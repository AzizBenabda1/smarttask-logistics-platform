<div class="page">
  <div class="header"><div><h1>Notifications</h1><p>Alertes et événements récents</p></div></div>
  <div class="card">
    <div class="alert-list">
      <div class="alert-item" *ngFor="let n of notifications" [class.unread]="!n.read" (click)="markRead(n)">
        <div class="title">{{ n.title }} <span class="badge" [ngClass]="n.priority">{{ n.priority }}</span></div>
        <div class="msg">{{ n.message }}</div>
        <small style="color:#94a3b8">{{ n.createdAt | date:'medium' }}</small>
      </div>
    </div>
    <div *ngIf="!notifications.length" class="empty">Aucune notification</div>
  </div>
</div>
