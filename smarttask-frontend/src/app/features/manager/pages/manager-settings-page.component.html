<div class="page">
  <div class="header"><div><h1>Paramètres</h1><p>Configuration du compte manager</p></div></div>
  <div class="card" *ngIf="auth.getCurrentUser() as user">
    <h2>Profil</h2>
    <p><strong>Nom :</strong> {{ user.firstName }} {{ user.lastName }}</p>
    <p><strong>Email :</strong> {{ user.email }}</p>
    <p><strong>Rôle :</strong> {{ user.role }}</p>
    <p style="margin-top:1rem"><a routerLink="/profile" class="btn btn-primary btn-sm">Modifier le profil</a></p>
  </div>
</div>
